name: VeloTV Android CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Run Unit Tests (Includes OWASP Wallpaper Allowlist & PIN Crypto Tests)
        run: ./gradlew testDebugUnitTest --stacktrace

      - name: Build Debug & Release APKs
        run: ./gradlew assembleDebug assembleRelease --stacktrace

      - name: Verify Zero Dangerous Permissions (POLA Security Gate)
        run: |
          AAPT=$(find "$ANDROID_HOME/build-tools" -name aapt2 | sort -V | tail -n 1)
          PERMS=$("$AAPT" dump permissions app/build/outputs/apk/release/app-release-unsigned.apk)
          echo "$PERMS"
          if echo "$PERMS" | grep -qE "RECORD_AUDIO|ACCESS_FINE_LOCATION|ACCESS_COARSE_LOCATION|READ_CONTACTS|CAMERA|READ_PHONE_STATE"; then
            echo "ERROR: Unexpected dangerous permission detected!"
            exit 1
          fi
          echo "PASS: POLA permission gate verified."

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: VeloTV-apks
          path: app/build/outputs/apk/**/*.apk
